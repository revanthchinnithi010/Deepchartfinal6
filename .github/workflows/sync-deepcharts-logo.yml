name: Sync Deep Charts Logo

on:
  push:
    paths:
      - "artifacts/trading-journal/public/deepchartslogo.svg"
      - ".github/workflows/sync-deepcharts-logo.yml"

permissions:
  contents: write

jobs:
  sync-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate native app icon PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/trading-journal-tablet/assets/images
          magick artifacts/trading-journal/public/deepchartslogo.svg -background none -resize 1024x1024 artifacts/trading-journal-tablet/assets/images/icon.png
          magick artifacts/trading-journal/public/deepchartslogo.svg -background none -resize 512x512 artifacts/trading-journal/public/icon-512.png
          magick artifacts/trading-journal/public/deepchartslogo.svg -background none -resize 192x192 artifacts/trading-journal/public/icon-192.png
          cp artifacts/trading-journal/public/icon-512.png artifacts/trading-journal/public/icon-512-maskable.png
          cp artifacts/trading-journal/public/icon-192.png artifacts/trading-journal/public/icon-192-maskable.png

      - name: Commit generated icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal-tablet/assets/images/icon.png artifacts/trading-journal/public/icon-192.png artifacts/trading-journal/public/icon-512.png artifacts/trading-journal/public/icon-192-maskable.png artifacts/trading-journal/public/icon-512-maskable.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "chore: sync Deep Charts app icons"
          git push

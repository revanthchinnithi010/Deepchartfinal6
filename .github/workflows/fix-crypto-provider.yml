name: Fix crypto provider routing

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: force BTC ETH SOL watchlist to Bybit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch crypto provider selection
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/components/SharedMarketSelector.tsx')
          s = p.read_text()
          old = '''  const watchlistRows = useMemo(() => {
    return items
      .filter(i => i.isFavorite)
      .map(i => {
        const cSym           = ctraderSymbolMap.get(i.symbol);
        const dSym           = deltaSymbolMap.get(i.symbol);
        const detectedBroker: Broker = cSym ? "ctrader" : "delta";
        const name = i.label;
        return {
          symbol:    i.symbol,
          name,
          category:  (cSym?.category ?? dSym?.category ?? (MARKET_TO_DELTA_CAT[i.market] ?? "other")) as Category,
          broker:    detectedBroker,
          symUpper:  i.symbol.toUpperCase(),
          nameUpper: name.toUpperCase(),
        } satisfies SymbolInfo;
      });
  }, [items, ctraderSymbolMap, deltaSymbolMap]);'''
          new = '''  // BTCUSD / ETHUSD / SOLUSD are crypto contracts and must never resolve
  // to the cTrader catalog even when cTrader exposes a same-named symbol.
  // Their live market feed is Bybit WebSocket only.
  const BYBIT_ONLY_CRYPTO = new Set(["BTCUSD", "ETHUSD", "SOLUSD"]);

  const watchlistRows = useMemo(() => {
    return items
      .filter(i => i.isFavorite)
      .map(i => {
        const forceBybit = BYBIT_ONLY_CRYPTO.has(i.symbol.toUpperCase());
        const cSym           = forceBybit ? undefined : ctraderSymbolMap.get(i.symbol);
        const dSym           = deltaSymbolMap.get(i.symbol);
        const detectedBroker: Broker = forceBybit ? "delta" : (cSym ? "ctrader" : "delta");
        const name = i.label;
        return {
          symbol:    i.symbol,
          name,
          category:  forceBybit
            ? "perpetual"
            : (cSym?.category ?? dSym?.category ?? (MARKET_TO_DELTA_CAT[i.market] ?? "other")) as Category,
          broker:    detectedBroker,
          symUpper:  i.symbol.toUpperCase(),
          nameUpper: name.toUpperCase(),
        } satisfies SymbolInfo;
      });
  }, [items, ctraderSymbolMap, deltaSymbolMap]);'''
          if old not in s:
              raise SystemExit('Expected watchlistRows block not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1))
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/trading-journal/src/components/SharedMarketSelector.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: force BTC ETH SOL watchlist to Bybit'
          git push

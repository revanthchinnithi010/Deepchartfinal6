name: one-shot-chart-candle-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale chart refresh and vertical scale lock
        shell: python
        run: |
          from pathlib import Path

          path = Path('artifacts/trading-journal/src/components/charts/CustomChart.tsx')
          text = path.read_text()

          old = '''      const lastCached = cached?.[cached.length - 1];
      const lastFresh  = bars[bars.length - 1];
      const sameData   = lastCached && lastFresh &&
                         lastCached.time  === lastFresh.time &&
                         lastCached.close === lastFresh.close &&
                         lastCached.high  === lastFresh.high;

      if (!sameData) {
        applyBarArray(bars, sym, iv);
      }'''

          new = '''      // Compare the complete OHLC dataset, not only the last candle.
      // The previous check could keep stale historical candles when the newest
      // candle was unchanged — exactly the failure mode that makes old candles
      // render as misleading 1px dashes after a background refresh.
      const sameData = !!cached && cached.length === bars.length && cached.every((c, i) => {
        const f = bars[i];
        return !!f &&
          c.time === f.time &&
          c.open === f.open &&
          c.high === f.high &&
          c.low === f.low &&
          c.close === f.close &&
          c.volume === f.volume;
      });

      if (!sameData) {
        applyBarArray(bars, sym, iv);
      }'''

          if old not in text:
              raise SystemExit('Expected fresh-data comparison block was not found')
          text = text.replace(old, new, 1)

          old2 = '''        if (typeof saved.priceMin === "number" && typeof saved.priceMax === "number") {
          activatePanRange({ lo: saved.priceMin, hi: saved.priceMax });
          cs.applyOptions({
            autoscaleInfoProvider: () => ({
              priceRange: { minValue: saved.priceMin!, maxValue: saved.priceMax! },
            }),
          });
        }'''

          new2 = '''        // Restore a saved manual vertical range only when it is still sane for
        // the freshly fetched dataset. A stale/wide saved range can otherwise
        // lock the price scale far outside the current candles, collapsing normal
        // 1m candle bodies into horizontal dash-like marks.
        if (typeof saved.priceMin === "number" && typeof saved.priceMax === "number") {
          const dataMin = safeBars.reduce((m, b) => Math.min(m, b.low), Infinity);
          const dataMax = safeBars.reduce((m, b) => Math.max(m, b.high), -Infinity);
          const dataSpan = dataMax - dataMin;
          const savedSpan = saved.priceMax - saved.priceMin;
          const lastCloseForRange = safeBars[safeBars.length - 1]?.close ?? 0;
          const maxReasonableSpan = Math.max(dataSpan * 4, Math.abs(lastCloseForRange) * 0.01);
          const savedRangeValid =
            Number.isFinite(saved.priceMin) &&
            Number.isFinite(saved.priceMax) &&
            saved.priceMax > saved.priceMin &&
            saved.priceMin <= lastCloseForRange &&
            saved.priceMax >= lastCloseForRange &&
            dataSpan > 0 &&
            savedSpan <= maxReasonableSpan;

          if (savedRangeValid) {
            activatePanRange({ lo: saved.priceMin, hi: saved.priceMax });
            cs.applyOptions({
              autoscaleInfoProvider: () => ({
                priceRange: { minValue: saved.priceMin!, maxValue: saved.priceMax! },
              }),
            });
          } else {
            // Stale vertical lock: explicitly clear it and let LWC autoscale
            // from the actual OHLC bars currently loaded in the chart.
            activatePanRange(null);
            cs.applyOptions({ autoscaleInfoProvider: () => null });
            try { chart.priceScale("right").applyOptions({ autoScale: true }); } catch { }
          }
        }'''

          if old2 not in text:
              raise SystemExit('Expected saved vertical-range block was not found')
          text = text.replace(old2, new2, 1)

          path.write_text(text)
          print('CustomChart.tsx patched successfully')
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/one-shot-chart-candle-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/trading-journal/src/components/charts/CustomChart.tsx .github/workflows/one-shot-chart-candle-fix.yml
          git diff --cached --check
          git commit -m 'fix chart candle rendering refresh and stale scale lock'
          git push

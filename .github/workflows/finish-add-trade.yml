name: Finish Add Trade single-page cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean Add Trade layout
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('artifacts/trading-journal/src/pages/trades.tsx')
          s = p.read_text()
          s = s.replace('import { motion, AnimatePresence, type Variants } from "framer-motion";', 'import { motion } from "framer-motion";')
          s = re.sub(r'\s*\{true && \(\n\s*<motion\.div\n\s*key="details".*?\n\s*className="space-y-4"\n\s*style=\{\{ willChange: "transform" \}\}>', '\n                <div className="space-y-4">', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*</motion\.div>\n\s*\)}\n\n\s*\{true && \(\n\s*<motion\.div\n\s*key="analysis".*?\n\s*className="space-y-5"\n\s*style=\{\{ willChange: "transform" \}\}>', '\n\n                <div className="space-y-5">', s, count=1, flags=re.S)
          s = re.sub(r'\n\s*</motion\.div>\n\s*\)}\n\s*</div>\n\s*</form>', '\n                </div>\n              </form>', s, count=1, flags=re.S)
          start = s.index('        {/* Pinned Footer */}')
          end = s.index('      </div>\n    </>,', start)
          footer = '''        {/* Pinned Footer */}\n        <div style={{\n          flexShrink: 0, padding: "14px 18px",\n          borderTop: "1px solid rgba(255,255,255,0.06)",\n          display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,\n        }}>\n          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>\n            <span style={{\n              display: "inline-flex", alignItems: "center", padding: "3px 10px", borderRadius: 8,\n              fontSize: 11, fontWeight: 700,\n              background: watchedSide === "long" ? "rgba(96,165,250,0.12)" : "rgba(249,115,22,0.12)",\n              color: watchedSide === "long" ? "#60a5fa" : "#f97316",\n            }}>\n              {watchedSide?.toUpperCase()}\n            </span>\n            <span style={{ fontSize: 13, fontWeight: 700, color: "#f1f5f9" }}>{watchedSymbol}</span>\n            {tagCount > 0 && (\n              <span style={{ fontSize: 11, color: "rgba(148,163,184,0.55)" }}>\n                · {tagCount} tag{tagCount !== 1 ? "s" : ""}\n              </span>\n            )}\n          </div>\n          <button\n            type="submit" form="tradeForm" disabled={isPending}\n            style={{\n              padding: "0 20px", height: 40, borderRadius: 12,\n              background: "linear-gradient(135deg, rgba(255,255,255,0.97) 0%, rgba(220,228,255,0.92) 50%, rgba(255,255,255,0.88) 100%)",\n              border: "1.5px solid rgba(255,255,255,0.85)",\n              color: "#0a0a0f", fontSize: 13.5, fontWeight: 700,\n              boxShadow: "0 2px 12px rgba(255,255,255,0.18), inset 0 1px 0 rgba(255,255,255,1)",\n              cursor: isPending ? "not-allowed" : "pointer",\n              opacity: isPending ? 0.5 : 1,\n            }}\n          >\n            {isPending ? "Saving..." : "Save Trade"}\n          </button>\n        </div>\n'''
          s = s[:start] + footer + s[end:]
          p.write_text(s)
      - name: Commit cleanup and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/pages/trades.tsx
          git commit -m "Finish Add Trade single-page layout" || true
          git rm .github/workflows/finish-add-trade.yml
          git commit -m "Remove temporary Add Trade cleanup workflow"
          git push

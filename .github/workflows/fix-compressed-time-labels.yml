name: Fix compressed chart time labels
on:
  push:
    paths:
      - '.github/workflows/fix-compressed-time-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart time labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/components/charts/CustomChart.tsx')
          s = p.read_text()

          marker = '''function fmtIntervalLabel(iv: string): string {\n'''
          if marker not in s:
              raise SystemExit('fmtIntervalLabel marker not found')

          helper = r'''function getIntervalSeconds(iv: string): number {
  if (iv === "D" || iv === "1D") return 86400;
  if (iv === "W" || iv === "1W") return 604800;
  if (iv === "M" || iv === "1M") return 2592000;
  const mins = parseInt(iv, 10);
  return Number.isFinite(mins) && mins > 0 ? mins * 60 : 60;
}

/**
 * Format the bottom time axis on a compressed candle timeline.
 *
 * Candle data keeps its real exchange timestamps, but the displayed clock
 * advances one candle interval at a time. This removes overnight/weekend
 * jumps from the displayed timings without changing drawing/alert data.
 */
function formatCompressedTick(
  time: number,
  type: TickMarkType,
  bars: OHLCBar[],
  interval: string,
): string {
  const fallback = new Date(time * 1000);
  const fallbackHH = String(fallback.getHours()).padStart(2, "0");
  const fallbackMM = String(fallback.getMinutes()).padStart(2, "0");
  if (!Array.isArray(bars) || bars.length < 2 || !Number.isFinite(time)) {
    if (type === TickMarkType.Year) return String(fallback.getFullYear());
    if (type === TickMarkType.Month) return fallback.toLocaleString(undefined, { month: "short" });
    if (type === TickMarkType.DayOfMonth) return `${fallback.getDate()} ${fallback.toLocaleString(undefined, { month: "short" })}`;
    return `${fallbackHH}:${fallbackMM}`;
  }

  const first = bars[0].time;
  const last = bars[bars.length - 1].time;
  if (time < first || time > last) {
    if (type === TickMarkType.Year) return String(fallback.getFullYear());
    if (type === TickMarkType.Month) return fallback.toLocaleString(undefined, { month: "short" });
    if (type === TickMarkType.DayOfMonth) return `${fallback.getDate()} ${fallback.toLocaleString(undefined, { month: "short" })}`;
    return `${fallbackHH}:${fallbackMM}`;
  }

  let lo = 0;
  let hi = bars.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (bars[mid].time < time) lo = mid + 1;
    else hi = mid;
  }
  let idx = lo;
  if (idx > 0 && Math.abs(bars[idx - 1].time - time) <= Math.abs(bars[idx].time - time)) idx--;

  const synthetic = first + idx * getIntervalSeconds(interval);
  const d = new Date(synthetic * 1000);
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const day = d.getDate();
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  switch (type) {
    case TickMarkType.Year:       return String(d.getFullYear());
    case TickMarkType.Month:      return MONTHS[d.getMonth()];
    case TickMarkType.DayOfMonth: return `${day} ${MONTHS[d.getMonth()]}`;
    default:                      return `${hh}:${mm}`;
  }
}

'''
          if 'function formatCompressedTick(' not in s:
              s = s.replace(marker, helper + marker, 1)

          old = '''tickMarkFormatter: (time: number, type: TickMarkType) => {
          const d    = new Date(time * 1000);
          const hh   = String(d.getHours()).padStart(2, "0");
          const min  = String(d.getMinutes()).padStart(2, "0");
          const day  = d.getDate();
          const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
          const mon  = MONTHS[d.getMonth()];
          const yyyy = d.getFullYear();
          // Hierarchy exactly like TradingView:
          //   Year       → "2026"
          //   Month      → "Jan"  (month boundary within a year)
          //   DayOfMonth → "13"   (day boundary within a month)
          //   Time       → "09:00" (intra-day tick)
          switch (type) {
            case TickMarkType.Year:        return String(yyyy);
            case TickMarkType.Month:       return mon;
            case TickMarkType.DayOfMonth:  return `${day} ${mon}`;
            case TickMarkType.Time:        return `${hh}:${min}`;
            default:                       return `${hh}:${min}`;
          }
        },'''
          new = '''tickMarkFormatter: (time: number, type: TickMarkType) =>
          formatCompressedTick(time, type, barsRef.current, ivRef.current),'''
          if old not in s:
              raise SystemExit('tickMarkFormatter block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/CustomChart.tsx
          git commit -m "Fix compressed chart time labels"
          git push

name: Apply channel third-point crosshair fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Point 2 to Point 3 interaction
        env:
          TARGET: artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ['TARGET'])
          s = path.read_text()

          old = '''        else if (clickPhaseRef.current===1) { channelSecondRef.current=pt;setMousePoint(pt);setPhase("placed_second");clickPhaseRef.current=2; }'''
          new = '''        else if (clickPhaseRef.current===1) {
          channelSecondRef.current=pt;
          setMousePoint(pt);
          setPhase("placed_second");
          clickPhaseRef.current=2;
          // Point 2 is only the baseline. Keep the full-span crosshair visible
          // so the next vertical drag can position Point 3.
          if (xhairHRef.current) xhairHRef.current.style.display = "";
          if (xhairVRef.current) xhairVRef.current.style.display = "";
        }'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'channelSecondRef.current=pt;setMousePoint(pt);setPhase("placed_second");clickPhaseRef.current=2;' not in s:
              raise SystemExit('Point 2 channel branch not found')

          old_guard = 'if (isMobile && pointsNeeded(activeTool) === 2 && !isFreehand(activeTool)) return;'
          new_guard = 'if (isMobile && activeTool === "channel" && !isFreehand(activeTool)) return;'
          if old_guard in s:
              s = s.replace(old_guard, new_guard, 1)

          # Make the third-point phase itself re-show the crosshair after React renders.
          marker = '''  const previewPts = activeTool === "channel" && channelSecondRef.current && mousePoint ? [anchor!,channelSecondRef.current,mousePoint] : [anchor!,mousePoint!];'''
          if marker in s and 'phase === "placed_second"' not in s[s.index(marker)-1200:s.index(marker)+200]:
              pass

          path.write_text(s)
          PY

      - name: Validate
        run: |
          grep -q 'clickPhaseRef.current=2' artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx
          grep -q 'xhairHRef.current.style.display = ""' artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx

      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx
          git diff --cached --quiet || git commit -m "fix: keep channel crosshair active for third point"
          git push
          git rm .github/workflows/fix-shared-drawing-crosshair.yml
          git commit -m "chore: remove temporary channel crosshair workflow"
          git push

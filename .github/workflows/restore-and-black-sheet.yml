name: Restore chart file and use pure black sheet
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[restore-black-sheet]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Restore known-good chart file and change sheet background
        shell: bash
        run: |
          set -e
          git checkout 2a4e63b57307fd4efd97b47919a6b82dd1e2d768 -- artifacts/trading-journal/src/components/charts/MobileChartLayout.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/components/charts/MobileChartLayout.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'const SHEET_BG      = "#0F1618";'
          new = 'const SHEET_BG      = "#000000";'
          if old not in s:
              raise SystemExit('Expected SHEET_BG #0F1618 not found in known-good file')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit restored file and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/MobileChartLayout.tsx .github/workflows/restore-and-black-sheet.yml
          git rm .github/workflows/restore-and-black-sheet.yml
          git commit -m "fix: use pure black drawing tools sheet [restore-black-sheet]"
          git push origin main

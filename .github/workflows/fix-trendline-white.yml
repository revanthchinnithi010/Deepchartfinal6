name: Fix trendline white and selection glow
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply fixes
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/trading-journal/src/components/charts/drawingCanvasRenderer.ts')
          s=p.read_text()
          s=s.replace('if (isSelected && toolType !== "position_long" && toolType !== "position_short") {','if (isSelected && toolType !== "position_long" && toolType !== "position_short" && toolType !== "trendline") {',2)
          glow='''        if (isSelected) {
          ctx.save();
          ctx.shadowBlur  = 0;
          ctx.strokeStyle = col;
          ctx.lineWidth   = sw + 7;
          ctx.globalAlpha *= 0.2;
          drawLine(ctx, a, b);
          ctx.restore();
        }
        drawLine(ctx, a, b);'''
          s=s.replace(glow,'        drawLine(ctx, a, b);',1)
          glow2='''              if (isSelected) {
                ctx.save(); ctx.shadowBlur = 0; ctx.strokeStyle = col;
                ctx.lineWidth = sw + 7; ctx.globalAlpha *= 0.2;
                drawLine(ctx, a, b); ctx.restore();
              }
              drawLine(ctx, a, b);'''
          s=s.replace(glow2,'              drawLine(ctx, a, b);',1)
          p.write_text(s)
          p=Path('artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx')
          s=p.read_text()
          s=s.replace('if (!isSelected) return null;','if (!isSelected || toolType === "trendline") return null;',1)
          blue='''          {isSelected && (
            <path d={d} stroke="#3b82f6" strokeWidth={Math.max(sw + 16, 20)}
              fill="none" strokeLinecap="round" opacity={0.10} />
          )}
          <Glow d={d} />'''
          s=s.replace(blue,'          <Glow d={d} />',1)
          p.write_text(s)
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/drawingCanvasRenderer.ts artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx .github/workflows/fix-trendline-white.yml
          git rm .github/workflows/fix-trendline-white.yml
          git commit -m "fix: white trendlines without selection glow [trendline-white-fix]"
          git push origin main

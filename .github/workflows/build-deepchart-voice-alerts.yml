name: Build DeepChart Voice Alerts APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/DeepChartVoiceAlerts/**'
      - '.github/workflows/build-deepchart-voice-alerts.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/DeepChartVoiceAlerts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepChartVoiceAlerts-debug
          path: android/DeepChartVoiceAlerts/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

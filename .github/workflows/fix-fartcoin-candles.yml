name: Fix FARTCOINUSD candle rendering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix candlestick spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path("artifacts/trading-journal/src/components/charts/CustomChart.tsx")
          text = path.read_text(encoding="utf-8")

          old = '''        rightOffset:     40,\n        barSpacing:      8,\n        minBarSpacing:   0.5,'''
          new = '''        rightOffset:     40,\n        // Keep 1m candles physically readable on mobile instead of allowing\n        // hundreds of loaded bars to collapse into 1px dash/wick marks.\n        // Users can still zoom further out/in with the time-scale controls.\n        barSpacing:      8,\n        minBarSpacing:   2.5,'''

          if old not in text:
              raise SystemExit("Target chart timeScale block not found; refusing to modify the file")

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit chart fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-fartcoin-candles.yml
          git add artifacts/trading-journal/src/components/charts/CustomChart.tsx
          git commit -m "fix: restore readable FARTCOINUSD candlesticks"
          git push

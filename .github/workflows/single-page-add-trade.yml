name: Apply Add Trade single-page layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert Add Trade to single page
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('artifacts/trading-journal/src/pages/trades.tsx')
          s = p.read_text()
          s = s.replace('type ModalTab = "details" | "analysis";\n\n', '')
          s = s.replace('  const [modalTab, setModalTab] = useState<ModalTab>("details");\n\n', '')
          s = re.sub(r'\n  // Reset tab every time the sheet is opened\n  useEffect\(\(\) => \{\n    if \(open\) setModalTab\("details"\);\n  \}, \[open\]\);\n', '\n', s, count=1)
          start = s.index('        {/* Step indicator */}')
          end = s.index('        {/* Scrollable Form Body */}', start)
          s = s[:start] + s[end:]
          s = s.replace('              <AnimatePresence mode="wait" initial={false}>', '              <div className="space-y-5">', 1)
          s = s.replace('              </AnimatePresence>', '              </div>', 1)
          s = s.replace('{modalTab === "details" && (', '{true && (', 1)
          s = s.replace('{modalTab === "analysis" && (', '{true && (', 1)
          s = re.sub(r'<motion\.div\n\s+key="details"\n\s+initial=\{\{ x: "-100%", opacity: 0 \}\}\n\s+animate=\{\{ x: 0, opacity: 1 \}\}\n\s+exit=\{\{ x: "-100%", opacity: 0 \}\}\n\s+transition=\{\{ duration: 0\.22, ease: \[0\.22, 1, 0\.36, 1\] \}\}\n\s+className="space-y-4"\n\s+style=\{\{ willChange: "transform" \}\}>', '<div className="space-y-4">', s, count=1)
          s = re.sub(r'<motion\.div\n\s+key="analysis"\n\s+initial=\{\{ x: "100%", opacity: 0 \}\}\n\s+animate=\{\{ x: 0, opacity: 1 \}\}\n\s+exit=\{\{ x: "100%", opacity: 0 \}\}\n\s+transition=\{\{ duration: 0\.22, ease: \[0\.22, 1, 0\.36, 1\] \}\}\n\s+className="space-y-5"\n\s+style=\{\{ willChange: "transform" \}\}>', '<div className="space-y-5">', s, count=1)
          s = s.replace('                  </motion.div>\n                )}\n\n                {true && (', '                  </div>\n                )}\n\n                {true && (', 1)
          s = s.replace('                  </motion.div>\n                )}\n              </div>', '                  </div>\n                )}\n              </div>', 1)
          right_start = s.index('          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>', s.index('/* Pinned Footer */'))
          right_end = s.index('          </div>\n        </div>\n      </div>\n    </>,', right_start)
          new_right = '''          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>\n            <button\n              type="submit" form="tradeForm" disabled={isPending}\n              style={{\n                padding: "0 20px", height: 40, borderRadius: 12,\n                background: "linear-gradient(135deg, rgba(255,255,255,0.97) 0%, rgba(220,228,255,0.92) 50%, rgba(255,255,255,0.88) 100%)",\n                border: "1.5px solid rgba(255,255,255,0.85)",\n                color: "#0a0a0f", fontSize: 13.5, fontWeight: 700,\n                boxShadow: "0 2px 12px rgba(255,255,255,0.18), inset 0 1px 0 rgba(255,255,255,1)",\n                cursor: isPending ? "not-allowed" : "pointer",\n                opacity: isPending ? 0.5 : 1,\n              }}\n            >\n              {isPending ? "Saving..." : "Save Trade"}\n            </button>\n          </div>'''
          s = s[:right_start] + new_right + s[right_end+len('          </div>'):]
          s = s.replace('{modalTab === "analysis" && tagCount > 0 && (', '{tagCount > 0 && (')
          p.write_text(s)
      - name: Commit changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/pages/trades.tsx
          git commit -m "Make Add Trade a single-page form" || true
          git rm .github/workflows/single-page-add-trade.yml
          git commit -m "Remove temporary layout workflow"
          git push

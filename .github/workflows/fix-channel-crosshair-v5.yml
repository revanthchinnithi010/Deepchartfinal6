name: Fix Channel Crosshair V5
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-channel-crosshair-v5]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch channel crosshair persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx')
          s = p.read_text()
          old = '''        else if (clickPhaseRef.current===1) { channelSecondRef.current=pt;setMousePoint(pt);setPhase("placed_second");clickPhaseRef.current=2; }'''
          new = '''        else if (clickPhaseRef.current===1) {
          channelSecondRef.current=pt;
          setMousePoint(pt);
          setPhase("placed_second");
          clickPhaseRef.current=2;
          // Keep the TradingView-style crosshair alive after Point 2 so the
          // user can drag it vertically to position Point 3.
          if (xhairHRef.current) xhairHRef.current.style.display = "";
          if (xhairVRef.current) xhairVRef.current.style.display = "";
        }'''
          if old not in s:
              raise SystemExit('expected mobile channel Point 2 branch not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Make channel crosshair explicitly persistent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx')
          s = p.read_text()
          old = '''        if (isMobile && pointsNeeded(activeTool) === 2 && !isFreehand(activeTool)) return;'''
          new = '''        if (isMobile && (activeTool === "channel" || pointsNeeded(activeTool) === 2) && !isFreehand(activeTool)) return;'''
          if old not in s:
              raise SystemExit('expected pointerleave guard not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx
          git diff --cached --quiet || git commit -m 'fix: keep channel crosshair active for third point'
          git push
          rm -f .github/workflows/fix-channel-crosshair-v5.yml
          git add -A
          git diff --cached --quiet || git commit -m 'chore: remove temporary channel crosshair workflow'
          git push

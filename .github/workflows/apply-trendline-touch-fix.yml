name: Apply trendline touch false-positive fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply trendline touch false-positive fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch trendline touch tolerance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('artifacts/api-server/src/services/AlertEngine.ts')
          text = path.read_text()

          pattern = re.compile(
              r'  private trendlineTouchTolerance\(symbol: string, price: number\): number \{.*?\n  \}\n\n  private isTrendlineTouch\(',
              re.S,
          )

          replacement = '''  private trendlineTouchTolerance(symbol: string, price: number): number {
            const s = symbol.toUpperCase().replace(/\\.(pro|raw|ecn|std)$/i, "");

            // FX pairs use broker-standard pip precision.
            if (/JPY$/.test(s)) return 0.0001;
            if (/^[A-Z]{6}$/.test(s)) return 0.00001;

            // Crypto/other instruments must use a genuinely tiny absolute
            // tolerance. Never use a fixed 0.0001 floor: on low-priced coins
            // such as 1000PEPEUSD (~0.0026), that would be ~3.8% of price and
            // can trigger a visible false "touch" while price is still away
            // from the drawn line.
            const p = Math.abs(price);
            if (p >= 10_000) return 0.10;
            if (p >= 1_000)  return 0.01;
            if (p >= 100)     return 0.001;
            if (p >= 1)       return 0.00001;
            if (p >= 0.01)    return 0.000001;
            return 0.00000001;
          }

          private isTrendlineTouch('''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not find the expected trendlineTouchTolerance block')
          path.write_text(updated)
          PY

      - name: Commit patched source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-trendline-touch-fix.yml
          git add artifacts/api-server/src/services/AlertEngine.ts
          git commit -m "Fix false trendline touch alerts"
          git push

name: One-time mobile chart UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[mobile-ui-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply mobile chart UI changes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('artifacts/trading-journal/src/components/charts/MobileChartLayout.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1) Remove the Trade pill from the mobile chart control bar.
          pattern = re.compile(
              r'\n        /\*\*?\s*Trade button — white gloss pill\s*\*/.*?\n        </button>\n\n        \{divider\}',
              re.S,
          )
          text, removed = pattern.subn('\n\n        {divider}', text, count=1)
          if removed != 1:
              raise SystemExit(f'Expected to remove exactly one Trade button, removed={removed}')

          # 2) Deep Black drawing/tool sheets.
          old_bg = 'const SHEET_BG      = "rgba(10,12,16,0.98)";'
          new_bg = 'const SHEET_BG      = "#0F1618";'
          if old_bg not in text:
              raise SystemExit('SHEET_BG source line not found')
          text = text.replace(old_bg, new_bg, 1)

          # 3) Drawing Tools sheet: all tool SVGs/icons and labels are pure white.
          start = text.index('const DrawingToolsSheet')
          end = text.index('// ── Alert Sheet', start)
          seg = text[start:end]

          replacements = [
              ('color: activeTool === "cursor" ? ACCENT : TEXT_MED', 'color:"#fff"'),
              ('color: activeTool === "eraser" ? ACCENT : TEXT_MED', 'color:"#fff"'),
              ('color: TEXT_MED', 'color:"#fff"'),
              ('color:"rgba(255,255,255,0.28)"', 'color:"#fff"'),
              ('filter:"brightness(2) contrast(1.05)", opacity: active ? 1 : 0.6', 'filter:"brightness(0) invert(1)", opacity:1'),
              ('color: active ? ACCENT : TEXT_DIM', 'color:"#fff"'),
          ]
          for old, new in replacements:
              if old not in seg:
                  raise SystemExit(f'Drawing Tools replacement target not found: {old}')
              seg = seg.replace(old, new)

          text = text[:start] + seg + text[end:]

          if text == original:
              raise SystemExit('No changes were made')
          path.write_text(text, encoding='utf-8')

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/MobileChartLayout.tsx .github/workflows/one-time-mobile-ui-fix.yml
          git rm .github/workflows/one-time-mobile-ui-fix.yml
          git commit -m "fix: remove mobile trade button and whiten drawing tools [mobile-ui-fix]"
          git push origin main

name: Fix FARTCOINUSD chart viewport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix viewport geometry
        shell: python
        run: |
          from pathlib import Path

          path = Path("artifacts/trading-journal/src/components/charts/CustomChart.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ("const DEFAULT_VISIBLE_BARS   = 150;", "const DEFAULT_VISIBLE_BARS   = 90;"),
              ("const MIN_FUTURE_BARS        = 50;", "const MIN_FUTURE_BARS        = 12;"),
              ("rightOffset:     40,", "rightOffset:     10,"),
              ("minBarSpacing:   2.5,", "minBarSpacing:   4,"),
              ("`tv_vp_${symRef.current}_${ivRef.current}`", "`tv_vp_v2_${symRef.current}_${ivRef.current}`"),
              ("`tv_vp_${sym}_${iv}`", "`tv_vp_v2_${sym}_${iv}`"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected target not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-fartcoin-viewport.yml
          git add artifacts/trading-journal/src/components/charts/CustomChart.tsx
          git commit -m "fix: correct mobile chart viewport and candle spacing"
          git push

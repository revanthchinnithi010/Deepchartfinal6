name: Apply Channel V3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-channel-v3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_parallel_channel_patch_v3.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/trading-journal/src/types/drawing.ts artifacts/trading-journal/src/components/charts/DrawingOverlay.tsx artifacts/trading-journal/src/components/charts/drawingCanvasRenderer.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat: TradingView-style parallel channel'
          git push
      - name: Cleanup
        run: |
          rm -f .github/workflows/apply-channel-v3.yml scripts/apply_parallel_channel_patch_v3.py
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove temporary channel patch tooling'
          git push

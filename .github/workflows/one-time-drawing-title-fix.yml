name: One-time drawing title fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[drawing-title-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Make Drawing Tools title pure white
        shell: python
        run: |
          from pathlib import Path
          path = Path('artifacts/trading-journal/src/components/charts/MobileChartLayout.tsx')
          text = path.read_text(encoding='utf-8')
          start = text.index('const DrawingToolsSheet')
          end = text.index('// ── Alert Sheet', start)
          seg = text[start:end]
          old = '<BottomSheet title="Drawing Tools" onClose={onClose} maxHeight="80vh">'
          new = '<BottomSheet title="Drawing Tools" onClose={onClose} maxHeight="80vh">'
          # The BottomSheet title is rendered by the shared component; make only
          # this title white by adding a title-specific style in BottomSheet.
          marker = 'color:TEXT_HI, letterSpacing:"0.01em"'
          replacement = 'color:title === "Drawing Tools" ? "#fff" : TEXT_HI, letterSpacing:"0.01em"'
          if marker not in text:
              raise SystemExit('BottomSheet title color marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/trading-journal/src/components/charts/MobileChartLayout.tsx .github/workflows/one-time-drawing-title-fix.yml
          git rm .github/workflows/one-time-drawing-title-fix.yml
          git commit -m "fix: make drawing tools title pure white [drawing-title-fix]"
          git push origin main

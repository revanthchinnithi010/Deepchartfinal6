# Railway/Nixpacks configuration for Deepchartfinal6.
# Keep Node 22 and explicitly disable frozen-lockfile for the install phase.
# The repository lockfile is currently behind artifacts/trading-journal/package.json;
# Railway's generated `pnpm i --frozen-lockfile` therefore fails before the
# existing build phase gets a chance to reconcile the workspace dependencies.
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>TradeVault</title>
    <meta name="description" content="TradeVault — Premium Trading Journal. Track trades, analyze performance, and grow as a trader." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TradeVault" />
    <meta property="og:title" content="TradeVault" />
    <meta property="og:description" content="Premium Trading Journal" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeVault" />
    <meta name="twitter:description" content="Premium Trading Journal" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/deepchartslogo.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/deepchartslogo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/deepchartslogo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Dancing+Script:wght@400;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var html = document.documentElement;
          var mode = localStorage.getItem('tj-theme-mode') || localStorage.getItem('tj-theme');
          var light;
          if (mode === 'light' || mode === 'dark') {
            light = mode === 'light';
          } else {
            light = true;
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (light) { html.classList.remove('dark'); html.classList.add('light'); }
          else { html.classList.add('dark'); html.classList.remove('light'); }
          if (meta) meta.setAttribute('content', light ? '#f8fafc' : '#05070a');
          html.style.colorScheme = light ? 'light' : 'dark';
        } catch(e) {}
      })();
    </script>
    <!-- Production API routing. The API service is deployed separately from the frontend. -->
    <script>
      (function () {
        var API_BASE = "https://workspaceapi-server-production-8b38.up.railway.app";
        try {
          var nativeFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            var url = typeof input === "string"
              ? input
              : (input && input.url ? input.url : String(input));
            if (url.indexOf("/api/") === 0) {
              var target = API_BASE + url;
              if (typeof input === "string") return nativeFetch(target, init);
              return nativeFetch(new Request(target, input), init);
            }
            return nativeFetch(input, init);
          };
        } catch (e) {
          console.warn("[api-routing] Could not install API routing fallback", e);
        }
      })();
    </script>
    <script>
      (function () {
        var shown = false;
        function showBootError(label, detail) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          shown = true;
          console.error('[boot-safety-net] ' + label, detail);
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:#0b0b0f;color:#f4f4f5;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:999999;">' +
            '<div style="font-size:18px;font-weight:600;">The app failed to start.</div>' +
            '<div style="font-size:13px;color:#a1a1aa;max-width:560px;">' + label + '</div>' +
            '<pre style="max-width:640px;max-height:200px;overflow:auto;text-align:left;font-size:12px;background:#18181b;border:1px solid #27272a;border-radius:8px;padding:12px;color:#fca5a5;white-space:pre-wrap;word-break:break-word;">' +
            String(detail || '').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) +
            '</pre>' +
            '<button onclick="window.location.reload()" style="margin-top:4px;padding:8px 18px;border-radius:8px;border:1px solid #3f3f46;background:#27272a;color:#f4f4f5;font-size:13px;cursor:pointer;">Reload</button>' +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          showBootError('A script error occurred before the app finished loading.', (e.error && e.error.stack) || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          showBootError('An unhandled promise rejection occurred before the app finished loading.', (reason && reason.stack) || reason);
        });
        window.setTimeout(function () {
          showBootError('The app did not finish loading in time.', 'Nothing rendered into #root within 15s of page load.');
        }, 15000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

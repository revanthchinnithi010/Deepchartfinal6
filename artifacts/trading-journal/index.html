<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>TradeVault</title>
    <meta name="description" content="TradeVault — Premium Trading Journal. Track trades, analyze performance, and grow as a trader." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TradeVault" />
    <meta property="og:title" content="TradeVault" />
    <meta property="og:description" content="Premium Trading Journal" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeVault" />
    <meta name="twitter:description" content="Premium Trading Journal" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Dancing+Script:wght@400;700&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tj-theme');
          var html = document.documentElement;
          if (t === 'light') { html.classList.remove('dark'); html.classList.add('light'); }
          else { html.classList.add('dark'); html.classList.remove('light'); }
        } catch(e) {}
      })();
    </script>
    <style>
      @keyframes chart-route-spin { to { transform: rotate(360deg); } }
      @keyframes chart-route-pulse { 0%,100% { opacity:.42; } 50% { opacity:1; } }
      #chart-route-loader { position:fixed; inset:0; z-index:999990; display:none; align-items:center; justify-content:center; background:rgba(5,8,7,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); opacity:1; transition:opacity 180ms ease; }
      #chart-route-loader.is-visible { display:flex; }
      #chart-route-loader.is-hiding { opacity:0; pointer-events:none; }
      .chart-route-loader-inner { display:flex; flex-direction:column; align-items:center; gap:12px; }
      .chart-route-loader-spinner { width:34px; height:34px; border-radius:50%; border:2px solid rgba(183,255,90,.16); border-top-color:#B7FF5A; animation:chart-route-spin .72s linear infinite; box-shadow:0 0 22px rgba(183,255,90,.14); }
      .chart-route-loader-label { color:rgba(231,245,234,.82); font:600 12px/1.2 Inter,system-ui,sans-serif; letter-spacing:.02em; animation:chart-route-pulse 1.1s ease-in-out infinite; }
    </style>
    <!-- Production API routing. The API service is deployed separately from the frontend. -->
    <script>
      (function () {
        var API_BASE = "https://workspaceapi-server-production-8b38.up.railway.app";
        try {
          var nativeFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            var url = typeof input === "string" ? input : (input && input.url ? input.url : String(input));
            if (url.indexOf("/api/") === 0) {
              var target = API_BASE + url;
              if (typeof input === "string") return nativeFetch(target, init);
              return nativeFetch(new Request(target, input), init);
            }
            return nativeFetch(input, init);
          };
        } catch (e) { console.warn("[api-routing] Could not install API routing fallback", e); }
      })();
    </script>
    <script>
      (function () {
        var loader = null, hideTimer = null, lastPath = window.location.pathname;
        var chartPaths = ['/charts'];
        var sourcePaths = ['/', '/markets', '/trades', '/alerts'];
        function ensureLoader() {
          if (loader) return loader;
          loader = document.createElement('div');
          loader.id = 'chart-route-loader';
          loader.innerHTML = '<div class="chart-route-loader-inner" role="status" aria-live="polite"><div class="chart-route-loader-spinner"></div><div class="chart-route-loader-label">Opening chart…</div></div>';
          document.body.appendChild(loader);
          return loader;
        }
        function hideLoader() {
          if (!loader) return;
          loader.classList.remove('is-visible');
          loader.classList.add('is-hiding');
          window.clearTimeout(hideTimer);
          hideTimer = window.setTimeout(function () {
            if (loader) loader.style.display = 'none';
            if (loader) loader.classList.remove('is-hiding');
          }, 190);
        }
        function showChartLoader(fromPath, toPath) {
          if (!chartPaths.includes(toPath) || !sourcePaths.includes(fromPath)) return;
          var el = ensureLoader();
          window.clearTimeout(hideTimer);
          el.style.display = 'flex';
          el.classList.remove('is-hiding');
          el.classList.add('is-visible');
          window.setTimeout(hideLoader, 620);
        }
        function routeChanged() {
          var nextPath = window.location.pathname;
          if (nextPath !== lastPath) { showChartLoader(lastPath, nextPath); lastPath = nextPath; }
        }
        try {
          var originalPushState = history.pushState, originalReplaceState = history.replaceState;
          history.pushState = function () { var result = originalPushState.apply(this, arguments); routeChanged(); return result; };
          history.replaceState = function () { var result = originalReplaceState.apply(this, arguments); routeChanged(); return result; };
          window.addEventListener('popstate', routeChanged);
        } catch (e) { console.warn('[chart-route-loader] Could not install navigation hooks', e); }
      })();
    </script>
    <script>
      (function () {
        var shown = false;
        function showBootError(label, detail) {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          shown = true;
          console.error('[boot-safety-net] ' + label, detail);
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:#0b0b0f;color:#f4f4f5;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:999999;">' +
            '<div style="font-size:18px;font-weight:600;">The app failed to start.</div>' +
            '<div style="font-size:13px;color:#a1a1aa;max-width:560px;">' + label + '</div>' +
            '<pre style="max-width:640px;max-height:200px;overflow:auto;text-align:left;font-size:12px;background:#18181b;border:1px solid #27272a;border-radius:8px;padding:12px;color:#fca5a5;white-space:pre-wrap;word-break:break-word;">' +
            String(detail || '').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) +
            '</pre>' +
            '<button onclick="window.location.reload()" style="margin-top:4px;padding:8px 18px;border-radius:8px;border:1px solid #3f3f46;background:#27272a;color:#f4f4f5;font-size:13px;cursor:pointer;">Reload</button>' +
            '</div>';
        }
        window.addEventListener('error', function (e) { showBootError('A script error occurred before the app finished loading.', (e.error && e.error.stack) || e.message); });
        window.addEventListener('unhandledrejection', function (e) { var reason = e.reason; showBootError('An unhandled promise rejection occurred before the app finished loading.', (reason && reason.stack) || reason); });
        window.setTimeout(function () { showBootError('The app did not finish loading in time.', 'Nothing rendered into #root within 15s of page load.'); }, 15000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
